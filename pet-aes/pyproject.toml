[project]
name = "pet-aes"
version = "0.0.1"
description = "Generic Agentic Enterprise System (AES) building blocks: agent spec/registry and MCP toolset wiring, adapted for the Petstore onboarding project."
authors = [{ name = "Tianjun Chen", email = "anakin.chen@fyrm.ai" }]
readme = "README.md"
keywords = ["python"]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.7",
    # No provider extras (anthropic/openai/...) needed: this package never
    # builds a Model itself, it only receives one an application already
    # built, so it only needs pydantic-ai's core types (Agent, Model, tools,
    # toolsets, messages).
    # 不需要任何 provider extra(anthropic/openai/……):这个包自己从来不构建
    # Model,只接收应用已经构建好的那一个,所以只需要 pydantic-ai 的核心类型
    # (Agent、Model、tools、toolsets、messages)。
    "pydantic-ai-slim>=2.0.0",
]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "License :: Other/Proprietary License",
    # Not a real PyPI classifier: the index rejects it, which is the point. An
    # accidental `twine upload` of internal code fails at the index instead of
    # at a reviewer.
    "Private :: Do Not Upload",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/fyrm-ai/pet-aes"
Homepage = "https://fyrm-ai.github.io/pet-aes/"
Documentation = "https://fyrm-ai.github.io/pet-aes/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0.0",
    "pre-commit>=4.5.1",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "mypy>=1.19.1",
    "ruff>=0.15.14",
    "codespell>=2.4.2",
    "commitizen>=4.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pet_aes"]

[tool.mypy]
files = ["src", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "YTT",
    "S",
    "B",
    "A",
    "C4",
    "T10",
    "SIM",
    "I",
    "C90",
    "E",
    "W",
    "F",
    "PGH",
    "UP",
    "RUF",
    "TRY",
    "ASYNC",
    "ARG",
    "RET",
    "PIE",
    "LOG",
    "TID",
    "PTH",
    "DTZ",
]
ignore = [
    "E501",
    "E731",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "ARG001", "ARG002"]

[tool.ruff.format]
preview = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
skip_empty = true
fail_under = 50

[tool.codespell]
skip = "uv.lock,.venv,__pycache__,.pytest_cache,.git"

# Conventional commits drive the version bump and the changelog. `make bump`
# reads the commits since the last tag, decides major/minor/patch, rewrites the
# version here and in CHANGELOG.md, and creates the tag.
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_files = ["pyproject.toml:^version"]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
