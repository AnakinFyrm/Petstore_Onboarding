default_install_hook_types: [pre-commit, pre-push, commit-msg]

default_language_version:
  python: python3.14

repos:
  # File hygiene: fast, syntactic, runs first so other hooks see clean inputs.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
        exclude: ^.devcontainer/devcontainer.json
      - id: pretty-format-json
        exclude: ^.devcontainer/devcontainer.json
        args: [--autofix, --no-sort-keys]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-ast
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Secret scanning: catches credentials and tokens before they hit git.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Typo detection: configured via [tool.codespell] in pyproject.toml.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]

  # Ruff: lint + format.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--exit-non-zero-on-fix]
      - id: ruff-format

  # uv: keep uv.lock in sync with pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.18
    hooks:
      - id: uv-lock

  # Heavy-but-essential checks run as local hooks so they use the uv venv.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (static type checking)
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: deptry
        name: deptry (unused / missing dependencies)
        entry: uv run deptry src
        language: system
        pass_filenames: false
        always_run: true

      - id: compileall
        name: python -m compileall
        entry: uv run python -m compileall -q src
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest (pre-push)
        entry: bash -c 'uv run pytest; status=$?; [ "$status" -eq 0 ] || [ "$status" -eq 5 ]'
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: commitizen
        name: commitizen (conventional commit message)
        entry: uv run cz check --commit-msg-file
        language: system
        stages: [commit-msg]
