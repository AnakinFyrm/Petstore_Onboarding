name: "Setup Python Environment"
description: "Set up Python environment for the given Python version"

inputs:
  python-version:
    description: "Python version to use"
    required: true
    default: "3.14"
  uv-version:
    # Pinned on purpose: uv resolves and installs the whole environment, so its
    # version is part of the build. Dependabot does not track it; bump it here.
    # Floor is 0.11: uv.lock is written at revision 3, `uv audit` (used by the
    # security workflow) arrived in 0.11.14, and 0.11.15 fixed two advisories
    # against uv itself that the audit would otherwise report.
    description: "uv version to use"
    required: true
    default: "0.11.32"

runs:
  using: "composite"
  steps:

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    # Pinned to an exact version, unlike every other action here: setup-uv
    # stopped publishing floating major tags. Dependabot keeps it current.
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: 'true'
        # The resolved input, not matrix.python-version: jobs without a matrix
        # would otherwise share one unsuffixed cache with every other job.
        cache-suffix: ${{ inputs.python-version }}

    - name: Install Python dependencies
      run: uv sync --frozen
      shell: bash
