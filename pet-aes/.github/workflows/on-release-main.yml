name: release-main

on:
  release:
    types: [published]

# Least privilege for the whole file; each job raises only what it needs.
# Deliberately no `concurrency` here: a release publish must never be
# interrupted by the next one.
permissions:
  contents: read

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    # `environment` is a job-level key; it is invalid at the workflow top level.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build documentation
        run: uv run mkdocs build --clean

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
