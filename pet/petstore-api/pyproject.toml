[project]
name = "petstore-api"
version = "0.1.0"
description = "Beginner FastAPI Petstore application used as the starting point for the Agentic Petstore onboarding project."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.14"
strict = true
disallow_untyped_defs = true
