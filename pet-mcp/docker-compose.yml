services:
  app:
    build: .
    container_name: pet-mcp
    # Later entries win, so precedence matches the in-app loader:
    # .env.$APP_ENV profile > .env.shared defaults. App config lives only in
    # these two files; a personal .env is never read.
    env_file:
      - path: .env.shared
        required: false
      - path: .env.${APP_ENV:-dev}
        required: false
    environment:
      APP_ENV: ${APP_ENV:-dev}
    restart: unless-stopped
